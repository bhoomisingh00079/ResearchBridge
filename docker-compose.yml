services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AGENT_SERVICE_URL=http://agent:8100
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-dev-secret-token}
    depends_on:
      agent:
        condition: service_healthy

  agent:
    build:
      context: ./agent_service
    ports:
      - "8100:8100"
    environment:
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-dev-secret-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

