name: ResearchBridge CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db python -m app.seed
          python -m pytest

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  agent-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agent service dependencies
        run: pip install -r agent_service/requirements.txt
      - name: Run agent service tests
        env:
          AGENT_SERVICE_TOKEN: test-secret-token
        run: python -m pytest agent_service/tests/ -v

  container-build:
    needs: [backend-test, frontend-build, agent-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/Dockerfile -t researchbridge-api:ci .

      - name: Build web image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_BASE_URL=/api -t researchbridge-web:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build, agent-test, container-build]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
