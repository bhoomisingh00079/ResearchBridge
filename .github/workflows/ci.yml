name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -d frontend
          test -d backend
          test -d agent
          test -d database

      - name: CI successful
        run: echo "CI pipeline completed successfully"